let me=null;
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=x=>Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:0});
async function api(path,opt={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),90000);try{const r=await fetch('/api'+path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},signal:controller.signal});const text=await r.text();let j;try{j=text?JSON.parse(text):{}}catch{throw new Error('Server returned an invalid response. Make sure Spring Boot is running on http://localhost:8080.')}if(!r.ok||j.success===false)throw new Error(j.message||('Request failed with HTTP '+r.status));return j.data??j}catch(err){if(err.name==='AbortError')throw new Error('The server took too long to generate the plan. Please try again.');throw err}finally{clearTimeout(timer)}}
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function nav(active){if(me?.role==='ADMIN')return `<div class="top"><div class="nav"><div class="navLeft"><div class="brand">Yatra<span>AI</span> 🌿</div><button class="navBtn ${active==='admin'?'active':''}" onclick="go('admin')">Dashboard</button></div><div class="navRight"><button class="navBtn" onclick="logout()">Logout</button><div class="avatar">${esc((me?.name||'A')[0]).toUpperCase()}</div></div></div></div>`;return `<div class="top"><div class="nav"><div class="navLeft"><div class="brand">Yatra<span>AI</span> 🌿</div><button class="navBtn ${active==='home'?'active':''}" onclick="go('home')">Home</button><button class="navBtn ${active==='planner'?'active':''}" onclick="go('planner')">Plan Trip</button><button class="navBtn ${active==='trips'?'active':''}" onclick="go('trips')">Recent Trips</button><button class="navBtn ${active==='about'?'active':''}" onclick="go('about')">About Us</button><button class="navBtn ${active==='feedback'?'active':''}" onclick="go('feedback')">Feedback</button></div><div class="navRight"><button class="navBtn ${active==='profile'?'active':''}" onclick="go('profile')">Profile</button><button class="navBtn" onclick="logout()">Logout</button><div class="avatar">${esc((me?.name||'U')[0]).toUpperCase()}</div></div></div></div>`}
function gateway(){app.innerHTML=`<main class="auth"><div style="width:min(1120px,100%);text-align:center"><div class="eyebrow">YatraAI • AI World Travel Planner</div><h1 style="font-size:clamp(40px,6vw,68px);letter-spacing:-3px;margin:10px 0">How would you like to enter?</h1><p class="mini" style="font-size:15px">Choose your workspace. Travellers get the AI planner; administrators get reports, traveller insights and system controls.</p><div class="gateway" style="margin:30px auto"><div class="gatewayCard" onclick="auth('USER')"><div class="gatewayIcon">🧳</div><h2>User / Traveller</h2><p class="mini">Plan trips, save itineraries, discover trip types, give feedback and manage your profile.</p><button class="btn primary">User Login →</button></div><div class="gatewayCard" onclick="auth('ADMIN')"><div class="gatewayIcon">📊</div><h2>Administrator</h2><p class="mini">Monitor users, trips, feedback and generate date-wise, traveller-wise, place-wise and city-wise reports.</p><button class="btn secondary">Admin Login →</button></div></div><div class="footer">Nature-green travel intelligence for the world • YatraAI</div></div></main>`}

function loginForm(role,msg=''){document.getElementById('authForm').innerHTML=`<div class="eyebrow">${role==='ADMIN'?'Administrator sign in':'Traveller sign in'}</div><h2>${role==='ADMIN'?'Admin Login':'User Login'}</h2>${msg?`<div class="error">${esc(msg)}</div>`:''}<form onsubmit="login(event,'${role}')"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div><button class="btn primary" style="width:100%">${role==='ADMIN'?'Open Admin Dashboard':'Start Planning'}</button></form>${role==='USER'?`<p class="mini">New traveller? <span class="switch" onclick="registerForm()">Create an account</span></p>`:''}<p class="mini"><span class="switch" onclick="gateway()">← Choose another login</span></p>${role==='ADMIN'?'<p class="mini">Demo admin: admin@travelai.com / Admin@123</p>':''}`}

y to choose a destination and start planning immediately.”</p><b>Neha • Mumbai</b></div></div></section><div class="footer">YatraAI • Java + Spring Boot • Planning prices are estimates, not live booking quotes.</div></main>`}

const $=id=>document.getElementById(id);
let META=null;
async function loadMeta(){if(!META)META=await api('/meta');return META}
function findDestMeta(txt){const t=String(txt||'').trim().toLowerCase();if(!t||!META)return null;return META.destinations.find(d=>d.name.toLowerCase()===t)||META.destinations.find(d=>t.includes(d.name.toLowerCase()))||null}
const FOOD_OPTS=['Any','Vegetarian','Non-Vegetarian','Jain','Vegan','Local Food','Premium Dining'];
async function planner(){
  let edit=sessionStorage.getItem('editTrip'),quick=sessionStorage.getItem('quickDestination');
  if(edit||quick){window.__pf={edit,quick,t:Date.now()};sessionStorage.removeItem('editTrip');sessionStorage.removeItem('quickDestination')}else if(window.__pf&&Date.now()-window.__pf.t<2000){edit=window.__pf.edit;quick=window.__pf.quick}
  const _pre=1;let M;try{M=await loadMeta()}catch(x){app.innerHTML=nav('planner')+`<main class="container"><div class="error">Could not load planner data: ${esc(x.message)}</div></main>`;return}
  const inDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  let d={startLocation:me.city||'',destination:'',startDate:inDays(14),days:3,adults:2,children:0,occupancy:2,budget:30000,interestKeys:['nature','history','food'],travelStyle:'Moderate',transport:'Train/Bus',foodPreference:'Any',hotelStandard:'Auto',hotelPlan:'change'};
  try{if(edit)Object.assign(d,JSON.parse(edit))}catch{}
  if(d.startDate<M.today)d.startDate=inDays(14);
  if(quick)d.destination=quick;
  const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
  app.innerHTML=nav('planner')+`<main class="container plannerPage"><section class="card plannerShell"><div class="eyebrow">Personalized trip planner</div><h1>Build your journey.</h1><p class="mini">Fill in the details below. The minimum budget is recalculated live from your group size, interests, travel mode, food and hotel choices.</p><div id="planError"></div>
  <form id="plannerForm" onsubmit="generate(event)" novalidate><div class="plannerGrid">
  <div class="field"><label>Starting location</label><input id="start" list="originList" value="${esc(d.startLocation)}" placeholder="e.g. Kolhapur" autocomplete="off"><datalist id="originList">${M.origins.map(o=>`<option value="${esc(o)}">`).join('')}</datalist></div>
  <div class="field"><label>Destination</label><input id="dest" list="destList" value="${esc(d.destination)}" placeholder="e.g. Goa, Delhi, Paris" autocomplete="off"><datalist id="destList">${M.destinations.map(x=>`<option value="${esc(x.name)}">${esc(x.country)}</option>`).join('')}</datalist></div>
  <div class="field"><label>Trip start date</label><input id="sdate" type="date" min="${M.today}" value="${esc(d.startDate)}"></div>
  <div class="field"><label>Number of days <span class="mini" id="daysHint"></span></label><input id="days" type="number" min="1" max="10" value="${d.days}"></div>
  <div class="field"><label>Adults (13+ yrs)</label><input id="adults" type="number" min="1" max="30" value="${d.adults}"></div>
  <div class="field"><label>Children (2–12 yrs)</label><input id="kids" type="number" min="0" max="20" value="${d.children}"></div>
  <div class="field"><label>Room sharing</label><select id="occ"><option value="1" ${d.occupancy==1?'selected':''}>Single – 1 person per room</option><option value="2" ${d.occupancy==2?'selected':''}>Double – 2 per room</option><option value="3" ${d.occupancy==3?'selected':''}>Triple – 3 per room</option><option value="4" ${d.occupancy==4?'selected':''}>Family – 4 per room</option></select></div>
  <div class="field"><label>Hotel standard</label><select id="hstd"><option value="Auto" ${d.hotelStandard==='Auto'?'selected':''}>Auto – best fit for my budget</option><option value="Budget" ${d.hotelStandard==='Budget'?'selected':''}>Budget (value stays)</option><option value="Comfort" ${d.hotelStandard==='Comfort'?'selected':''}>Comfort (3–4★)</option><option value="Premium" ${d.hotelStandard==='Premium'?'selected':''}>Premium (5★ / luxury)</option></select></div>
  <div class="field"><label>Hotel plan</label><select id="hplan"><option value="change" ${d.hotelPlan==='change'?'selected':''}>Different hotel each night (near that day's area)</option><option value="same" ${d.hotelPlan==='same'?'selected':''}>Stay in one hotel throughout</option></select></div>
  <div class="field"><label>Travel mode (to destination)</label><select id="transport">${opt(M.transports,d.transport)}</select><div class="mini" id="modeHint"></div></div>
  <div class="field"><label>Food preference</label><select id="food">${opt(M.foods,d.foodPreference)}</select></div>
  <div class="field"><label>Travel style</label><select id="style">${opt(M.styles,d.travelStyle)}</select></div>
  <div class="field full"><label>Interests <span class="mini">(choose one or more – places are picked to match)</span></label><div class="chips">${M.interests.map(x=>`<label class="chip"><input type="checkbox" name="interest" value="${x.key}" ${d.interestKeys.includes(x.key)?'checked':''}>${x.icon} ${esc(x.label)}</label>`).join('')}</div></div>
  <div class="field full"><label>Total trip budget (₹) for the whole group</label><input id="budget" type="number" min="100" step="100" value="${d.budget}"><div id="budgetMsg" class="estimateBox"><div class="mini">Checking minimum budget…</div></div></div>
  <div class="field full"><div id="generationStatus" style="margin-bottom:10px"></div><button id="generateBtn" type="submit" class="btn primary plannerSubmit">Generate complete plan →</button></div>
  </div></form></section></main>`;
  ['start','dest','sdate','days','adults','kids','budget'].forEach(id=>$(id).addEventListener('input',debouncedEstimate));
  ['occ','hstd','hplan','transport','food','style'].forEach(id=>$(id).addEventListener('change',debouncedEstimate));
  document.querySelectorAll('input[name=interest]').forEach(x=>x.addEventListener('change',debouncedEstimate));
  debouncedEstimate();
}
function collectReq(){
  const interests=[...document.querySelectorAll('input[name=interest]:checked')].map(x=>x.value).join(',');
  return{startLocation:$('start').value.trim(),destination:$('dest').value.trim(),startDate:$('sdate').value,days:+$('days').value,adults:+$('adults').value,children:+($('kids').value||0),occupancy:+$('occ').value,
    budget:+$('budget').value,interests,travelStyle:$('style').value,transport:$('transport').value,food:$('food').value,hotelStandard:$('hstd').value,hotelPlan:$('hplan').value}
}
let estimateTimer,estimateSeq=0;
function debouncedEstimate(){clearTimeout(estimateTimer);estimateTimer=setTimeout(updateEstimate,300)}
async function updateEstimate(){
  const msg=$('budgetMsg'),btn=$('generateBtn');if(!msg||!btn)return;
  const dm=findDestMeta($('dest').value);
  if(dm){$('days').max=dm.maxDays;$('daysHint').textContent='(max '+dm.maxDays+' for '+dm.name+')';
    const t=$('transport');if(dm.intl){if(t.value!=='Flight')t.value='Flight';$('modeHint').textContent='International trip – flight is required.'}else $('modeHint').textContent=''}
  else{$('daysHint').textContent='';$('modeHint').textContent=''}
  const seq=++estimateSeq,req=collectReq();
  try{
    const e=await api('/plan/estimate',{method:'POST',body:JSON.stringify(req)});
    if(seq!==estimateSeq)return;
    if(!e.ok){msg.className='error';msg.innerHTML='<b>Please fix:</b><ul style="margin:6px 0 0 18px;padding:0">'+e.errors.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';btn.disabled=true;return}
    const b=e.breakdown,g=e.group,ok=req.budget>=e.minimumFeasible;
    const rows=[['Travel to & from '+e.destination,b.intercity],['Hotels ('+e.nights+' night'+(e.nights==1?'':'s')+', '+g.rooms+' room'+(g.rooms>1?'s':'')+')',b.stay],['Food ('+req.food+')',b.food],['Local transport',b.local],['Entry fees & activities',b.activities]];
    if(b.visa)rows.push(['Visa & insurance (approx.)',b.visa]);
    msg.className=ok?'success':'error';
    msg.innerHTML=`<div style="font-weight:850;margin-bottom:6px">${ok?'✓ Budget is enough':'✕ Budget too low'} — minimum required: <b>₹${money(e.minimumFeasible)}</b> <span class="mini">(${esc(e.minimumBasis)})</span>${ok?'':` · short by <b>₹${money(e.shortfall)}</b>`}</div>
    <table class="miniTable">${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>₹${money(r[1])}</td></tr>`).join('')}<tr class="tot"><td>Minimum total</td><td>₹${money(e.minimumFeasible)}</td></tr></table>
    <div class="mini" style="margin-top:6px">👥 ${esc(g.summary)}. For some breathing room (10% buffer) plan for about <b>₹${money(e.comfortBudget)}</b>.</div>${(e.warnings||[]).map(w=>`<div class="mini warnLine">⚠ ${esc(w)}</div>`).join('')}`;
    btn.disabled=!ok;
  }catch(x){if(seq!==estimateSeq)return;msg.className='error';msg.innerHTML='Budget check failed: '+esc(x.message);btn.disabled=false}
}
async function generate(e){
  if(e&&e.preventDefault)e.preventDefault();
  const error=$('planError'),status=$('generationStatus'),btn=$('generateBtn');
  if(error)error.innerHTML='';if(status)status.innerHTML='';
  const req=collectReq();
  try{
    btn.disabled=true;btn.textContent='Generating your plan…';
    status.innerHTML='<div class="success">⏳ Building your itinerary with real places, hotels, rooms, distances and budget…</div>';
    const p=await api('/plan',{method:'POST',body:JSON.stringify(req)});
    if(!p||!Array.isArray(p.daysPlan)||!p.daysPlan.length)throw new Error('The server returned no itinerary. Please try again.');
    sessionStorage.setItem('lastPlan',JSON.stringify(p));location.hash='result';await render();scrollTo(0,0);
  }catch(x){
    console.error('YatraAI plan generation error:',x);
    const html='<div class="error"><b>Plan could not be generated.</b><br>'+esc(x?.message||'Unknown error')+'</div>';
    if(error)error.innerHTML=html;if(status)status.innerHTML='';
    error?.scrollIntoView({behavior:'smooth',block:'center'});
  }finally{const b=$('generateBtn');if(b){b.textContent='Generate complete plan →';updateEstimate()}}
}
async function loadWikiImage(el,title,city=''){el.src='/api/place-image?name='+encodeURIComponent(title)+'&city='+encodeURIComponent(city);el.style.opacity='1'}
function getPlan(){try{return JSON.parse(sessionStorage.getItem('lastPlan'))}catch{return null}}
function fmtDate(d){if(!d)return'';const x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function downloadPlanPdf(){
  const p=getPlan();if(!p){toast('Generate a plan first.');return}
  if(!window.jspdf||!window.YatraPdf){toast('PDF library did not load. Refresh the page and try again.');return}
  try{const doc=YatraPdf.buildPlanPdf(window.jspdf.jsPDF,p);doc.save('YatraAI-'+String(p.destination||'Trip').replace(/[^a-z0-9]+/gi,'-')+'-Travel-Plan.pdf');toast('PDF downloaded.')}
  catch(x){console.error(x);toast('Could not create the PDF: '+x.message)}
}
function recalcPlan(p){
  let hotel=0;const entries=[];
  (p.daysPlan||[]).forEach(d=>{if(d.hotel&&typeof d.hotel==='object'){hotel+=d.hotel.nightCost;d.hotelNightCost=d.hotel.nightCost;d.hotelName=d.hotel.name;entries.push({...d.hotel,night:d.day,checkIn:d.checkIn,checkOut:d.checkOut,area:d.areaName})}});
  p.hotelCost=hotel;if(p.breakdown)p.breakdown.stay=hotel;
  p.estimatedCost=Math.round((p.intercityTravel||0)+hotel+(p.foodCost||0)+(p.localTravelCost||0)+(p.activitiesCost||0)+(p.visaCost||0));
  p.emergencyBuffer=Math.round(p.estimatedCost*.1);p.recommendedBudget=p.estimatedCost+p.emergencyBuffer;
  p.remainingBudget=Math.round(p.budget-p.estimatedCost);p.budgetStatus=p.estimatedCost<=p.budget?'Within budget':'Over budget';
  if(p.booking)p.booking.entries=entries;
}
function pickHotel(di,oi){
  const p=getPlan();if(!p)return;const d=p.daysPlan[di];if(!d||!Array.isArray(d.hotelOptions))return;
  d.hotelOptions.forEach((o,i)=>o.selected=i===oi);d.hotel=d.hotelOptions[oi];recalcPlan(p);
  sessionStorage.setItem('lastPlan',JSON.stringify(p));const y=scrollY;result();scrollTo(0,y);
}
function hotelCard(d,di,p){

  if(!h)return`<div class="stay"><div class="mini">🧳 Departure day${d.checkoutFrom?' — check out from <b>'+esc(d.checkoutFrom)+'</b>':''}. No overnight stay.</div></div>`;

  <div class="hotelLinks"><a href="${esc(h.mapUrl)}" target="_blank">📍 Map</a><a href="${esc(h.searchUrl)}" target="_blank">🔎 Check rates & book</a>${h.website?`<a href="${esc(h.website)}" target="_blank">Official site</a>`:''}</div>
  <div class="mini" style="margin:8px 0 4px"><b>Switch hotel for this night</b> (real hotels near ${esc(d.areaName)}):</div><div class="hotelOptions">${d.hotelOptions.map((o,oi)=>`<label class="hotelOption ${o.selected?'sel':''}"><input type="radio" name="h${di}" ${o.selected?'checked':''} onchange="pickHotel(${di},${oi})"><b>${esc(o.name)}</b><span class="badge">${esc(o.tierLabel)}</span><div class="mini">${esc(o.zoneName)}</div><div class="mini"><b>₹${money(o.rate)}</b> / room / night → ₹${money(o.nightCost)} for ${rooms} room${rooms>1?'s':''}</div></label>`).join('')}</div></div>`;
}
function result(){
  const p=getPlan();if(!p){go('planner');return}
  const over=+p.estimatedCost>+p.budget,g=p.group,br=p.breakdown||{};
  const bar=(l,v)=>`<div class="routeItem"><small>${l}</small><b>₹${money(v)}</b></div>`;
  app.innerHTML=nav('planner')+`<main class="container"><div class="pageTitle"><div class="eyebrow">Your trip is ready</div><h2>${esc(p.destination)} • ${p.days} days</h2><p class="mini">${esc(p.startLocation)} → ${esc(p.destination)} • ${p.startDate?esc(fmtDate(p.startDate))+' – '+esc(fmtDate(p.endDate))+' • ':''}${p.adults!=null?p.adults+' adult(s)'+(p.children?' + '+p.children+' child(ren)':''):p.travelers+' traveller(s)'} • ${p.uniquePlaces} unique experiences</p></div>
  ${(p.warnings||[]).map(w=>`<div class="warnBox">⚠ ${esc(w)}</div>`).join('')}
  <section class="card resultHero"><div class="resultTop"><div><h3 style="margin:0">Budget summary</h3><p class="mini">${over?'⚠ Over budget':'✓ Within budget'} • ${p.interests?'Interests: '+esc(p.interests).replace(/,/g,', '):''}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="downloadPlanPdf()">⬇ Download PDF</button><button class="btn secondary" onclick="go('planner')">Plan another</button><button class="btn ghost" onclick="go('trips')">Recent Trips</button></div></div>
  <div class="routeSummary">${bar('Your budget',p.budget)}${bar('Estimated cost',p.estimatedCost)}${bar(over?'Over by':'Remaining',Math.abs(p.remainingBudget??p.budget-p.estimatedCost))}${bar('Travel (return)',p.intercityTravel)}${bar('Recommended + 10% buffer',p.recommendedBudget)}</div>
  <div class="budgetBar ${over?'over':''}"><i style="width:${Math.min(100,Math.round(p.estimatedCost/p.budget*100))}%"></i></div>
  <p class="mini">Hotels ₹${money(p.hotelCost)} • Food ₹${money(p.foodCost)} • Local transport ₹${money(p.localTravelCost)} • Activities ₹${money(p.activitiesCost)}${p.visaCost?' • Visa & insurance ₹'+money(p.visaCost):''} • Travel ₹${money(p.intercityTravel)}</p></section>
  ${g?`<section class="card section" style="padding:22px"><h3 style="margin:0 0 4px">👥 Group & room plan</h3><p class="mini" style="font-size:14px"><b>${esc(g.summary)}</b></p><div class="roomGrid">${g.roomPlan.map(r=>`<div class="roomBox"><b>Room ${r.room}</b><div class="mini">${esc(r.label.replace(/^Room \d+:\s*/,''))}</div><span class="badge">${esc(r.type)}</span></div>`).join('')}</div>${(g.tips||[]).map(t=>`<div class="mini">• ${esc(t)}</div>`).join('')}</section>`:''}
  ${p.booking&&p.booking.entries&&p.booking.entries.length?`<section class="card section" style="padding:22px"><h3 style="margin:0 0 4px">🏨 Hotel booking plan</h3><p class="mini">${p.booking.nights} night(s) • book <b>${esc(p.booking.roomSummary)}</b> each night. ${esc(p.booking.note)}</p><div class="tableWrap"><table class="table"><tr><th>Night</th><th>Dates</th><th>Hotel</th><th>Area</th><th>Rooms × rate</th><th>Total</th><th></th></tr>${p.booking.entries.map(e=>`<tr><td>${e.night}</td><td>${esc(fmtDate(e.checkIn))} → ${esc(fmtDate(e.checkOut))}</td><td><b>${esc(e.name)}</b><div class="mini">${esc(e.address)}</div></td><td>${esc(e.zoneName)}</td><td>${e.rooms} × ₹${money(e.rate)}</td><td><b>₹${money(e.nightCost)}</b></td><td><a href="${esc(e.searchUrl)}" target="_blank">Check rates & book</a></td></tr>`).join('')}<tr><td colspan="5" style="text-align:right"><b>Total stay</b></td><td colspan="2"><b>₹${money(p.hotelCost)}</b></td></tr></table></div></section>`:''}
  ${(p.daysPlan||[]).map((day,di)=>`<section class="day"><div class="dayHead"><div><b>Day ${day.day} • ${esc(day.areaName||day.hotelArea||day.title)}</b>${day.date?` <span class="badge">${esc(fmtDate(day.date))}</span>`:''}<div class="mini">${esc(day.title)}${day.zoneName?' • 📍 '+esc(day.zoneName):''}</div>${day.excursionNote?`<div class="mini warnLine">${esc(day.excursionNote)}</div>`:''}</div><div class="mini" style="text-align:right">${day.hotelToFirstKm?`First stop ≈ ${esc(day.hotelToFirstKm)} km / ${esc(day.hotelToFirstMinutes)} min from ${day.firstStopFrom?esc(day.firstStopFrom):'your hotel'}`:''}${day.routeUrl?`<br><a href="${esc(day.routeUrl)}" target="_blank">🗺️ Open day route in Maps</a>`:''}</div></div>
  ${day.places.map((x,i)=>`${i?`<div class="travelLine">↳ ${esc(x.distanceFromPrevious)}</div>`:''}<article class="place"><div class="placeMedia"><img class="placeImg" loading="lazy" src="${esc(x.imageUrl||('/api/place-image?name='+encodeURIComponent(x.name)+'&city='+encodeURIComponent(p.destination)))}" alt="${esc(x.name)}"><span class="placeTag">${esc(x.category)}</span></div><div class="placeInfo"><div class="time">${esc(x.time)}</div><h3>${esc(x.name)}</h3><div class="mini">${esc(x.duration)} • ${esc(x.area)}</div><p class="mini" style="margin:6px 0">${esc(x.description)}</p><div class="linkRow"><a href="${esc(x.mapUrl)}" target="_blank">📍 View on Maps</a><a href="${esc(x.wikiUrl)}" target="_blank">ⓘ About</a></div></div><div class="cost">₹${money(x.cost)}<div class="mini">${x.perPerson!=null?'₹'+money(x.perPerson)+' / adult':'group'}</div></div></article>`).join('')}
  <div class="dayCosts mini">Day costs: activities ₹${money(day.activitiesCost||0)} • local transport ₹${money(day.localTransportCost||0)} • food ₹${money(day.foodCost||0)}${day.hotelNightCost?' • hotel ₹'+money(day.hotelNightCost):''}</div>${hotelCard(day,di,p)}</section>`).join('')}
  <section class="section card" style="padding:22px"><b>Good to know</b>${(p.tips||[]).map(t=>`<p class="mini" style="margin:6px 0 0">• ${esc(t)}</p>`).join('')}</section></main>`;
}
async function trips(){app.innerHTML=nav('trips')+`<main class="container page"><div class="pageTitle"><div class="eyebrow">Your travel journal</div><h2>Recent Trips</h2><p class="mini">All trips saved by the currently logged-in user are shown below. The newest journey is highlighted first.</p></div><div id="tripBox"></div></main>`;try{const list=await api('/trips');if(!list.length){$('tripBox').innerHTML='<div class="empty">🌿<h3>No trips saved yet</h3><p class="mini">Create your first personalized journey and it will appear here.</p><button class="btn primary" onclick="go(\'planner\')">Create first trip</button></div>';return}const latest=list[0];$('tripBox').innerHTML=`<section class="tripLatest card"><div class="eyebrow">Most recent trip • ${new Date(latest.createdAt).toLocaleString()}</div><h2 style="margin:8px 0">${esc(latest.destination)}</h2><p class="mini">${esc(latest.startLocation)} → ${esc(latest.destination)} • ${latest.days} days • ${latest.travelers} traveller(s)</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="viewTrip(${latest.id})">View trip</button><button class="btn ghost" onclick="editTrip(${latest.id})">Edit</button><button class="btn danger" onclick="deleteTrip(${latest.id})">Delete</button></div></section><div class="sectionHead"><div><div class="eyebrow">Saved by this user</div><h2 style="font-size:30px">All Trips</h2></div></div><div class="tripGrid">${list.map(x=>`<article class="tripCard card"><div class="eyebrow">${new Date(x.createdAt).toLocaleDateString()}</div><h3>${esc(x.destination)}</h3><p class="mini">${esc(x.startLocation)} → ${esc(x.destination)}</p><div class="tripMeta"><div class="metaBox"><small>Days</small><b>${x.days}</b></div><div class="metaBox"><small>Travellers</small><b>${x.travelers}</b></div><div class="metaBox"><small>Budget</small><b>₹${money(x.budget)}</b></div><div class="metaBox"><small>Estimate</small><b>₹${money(x.estimatedCost)}</b></div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary" onclick="viewTrip(${x.id})">View</button><button class="btn ghost" onclick="editTrip(${x.id})">Edit</button><button class="btn danger" onclick="deleteTrip(${x.id})">Delete</button></div></article>`).join('')}</div></main>`}catch(x){$('tripBox').innerHTML=`<div class="error">${esc(x.message)}</div>`}}
async function allTripsPage(){app.innerHTML=nav('trips')+`<main class="container"><div class="pageTitle"><div class="eyebrow">Travel journal</div><h2>All your trips</h2></div><div id="tripList" class="grid"></div></main>`;try{const list=await api('/trips');document.getElementById('tripList').innerHTML=list.length?list.map(t=>`<div class="card" style="padding:22px"><div class="eyebrow">${new Date(t.createdAt).toLocaleDateString()}</div><h3>${esc(t.destination)}</h3><p class="mini">${esc(t.startLocation)} • ${t.days} days • ${t.travelers} traveller(s)</p><h3>₹${money(t.estimatedCost)}</h3><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary" onclick="viewTrip(${t.id})">View</button><button class="btn ghost" onclick="editTrip(${t.id})">Edit</button><button class="btn danger" onclick="deleteTrip(${t.id})">Delete</button></div></div>`).join(''):`<div class="empty">No saved trips.</div>`}catch(x){toast(x.message)}}
async function viewTrip(id){try{const t=await api('/trips/'+id);sessionStorage.setItem('lastPlan',JSON.stringify(t.itinerary));go('result')}catch(x){toast(x.message)}}
async function editTrip(id){try{const t=await api('/trips/'+id);const it=t.itinerary||{};sessionStorage.setItem('editTrip',JSON.stringify({startLocation:t.startLocation,destination:t.destination,days:t.days,budget:t.budget,adults:it.adults??t.travelers,children:it.children??0,occupancy:it.group?.occupancy??2,interestKeys:it.interestKeys||String(t.interests||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),travelStyle:it.travelStyle||'Moderate',transport:it.transport||'Train/Bus',foodPreference:it.foodPreference||'Any',hotelStandard:it.hotelStandard||'Auto',hotelPlan:it.hotelPlan||'change',startDate:it.startDate||''}));go('planner')}catch(x){toast(x.message)}}
async function deleteTrip(id){if(!confirm('Delete this trip?'))return;try{await api('/trips/'+id,{method:'DELETE'});toast('Trip deleted');trips()}catch(x){toast(x.message)}}
function profile(){app.innerHTML=nav('profile')+`<main class="container"><div class="pageTitle"><div class="eyebrow">Your account</div><h2>Profile & preferences</h2></div><section class="profile"><div class="card"><div class="bigAvatar">${esc((me.name||'U')[0]).toUpperCase()}</div><h2>${esc(me.name)}</h2><p class="mini">${esc(me.email)}</p><span class="badge">${esc(me.role)}</span></div><div class="card"><form onsubmit="saveProfile(event)"><div class="two"><div class="field"><label>Name</label><input id="pname" value="${esc(me.name)}" required></div><div class="field"><label>Phone</label><input id="pphone" value="${esc(me.phone)}"></div></div><div class="field"><label>Home city</label><input id="pcity" value="${esc(me.city)}"></div><div class="field"><label>About your travel style</label><textarea id="pbio" rows="5">${esc(me.bio)}</textarea></div><button class="btn primary">Save changes</button></form></div></section></main>`}
async function saveProfile(e){e.preventDefault();try{me=await api('/profile',{method:'PUT',body:JSON.stringify({name:pname.value,phone:pphone.value,city:pcity.value,bio:pbio.value})});toast('Profile updated');profile()}catch(x){toast(x.message)}}
const tripTypes={family:{icon:'👨‍👩‍👧‍👦',title:'Family Trip',desc:'Comfortable, memorable places with easy-going sightseeing.',places:[['Agra','Taj Mahal','See the white-marble monument, gardens and detailed inlay work in a relaxed family-friendly visit.'],['Kerala','Alleppey Houseboat','Cruise the backwaters past villages, coconut palms and calm waterways with plenty of time to unwind.'],['Jaipur','City Palace','Explore royal courtyards, museums and colourful architecture in the heart of Jaipur’s old city.'],['Delhi','National Zoological Park','Meet wildlife in a spacious city zoo with shaded paths and an easy outdoor day for different age groups.']]},friends:{icon:'🧑‍🤝‍🧑',title:'Friends Trip',desc:'Fun, food, photos and flexible days with plenty to explore.',places:[['Goa','Baga Beach','Enjoy the lively beach, cafés, water activities and an energetic evening atmosphere with friends.'],['Mumbai','Marine Drive','Walk beside the sea, grab street food and watch the skyline light up along Mumbai’s famous boulevard.'],['Jaipur','Hawa Mahal','Photograph the iconic pink façade, browse nearby markets and explore the busy heritage lanes together.'],['Pune','Sinhagad Fort','Take a hill outing for fort ruins, panoramic views and local snacks after an active day.']]},business:{icon:'💼',title:'Business Trip',desc:'Efficient city breaks with short, practical experiences after work.',places:[['Bengaluru','Cubbon Park','Take a short green break among historic trees and walking paths after meetings or during a free evening.'],['Mumbai','Bandra-Worli Sea Link','Enjoy an easy city-view stop with dramatic skyline and bridge views without losing a full evening.'],['Delhi','Connaught Place','Shop, dine or take a heritage walk around a central district that works well with limited free time.'],['Singapore','Gardens by the Bay','Unwind in futuristic gardens and the Marina Bay skyline after meetings, an easy evening out for business travellers.']]},solo:{icon:'🎒',title:'Solo Trip',desc:'Flexible exploration, culture, cafés and places that reward slow discovery.',places:[['Delhi','Humayun’s Tomb','Wander through the landscaped garden tomb, admire the architecture and explore at your own pace.'],['Goa','Fontainhas','Walk through colourful Portuguese-era lanes, photograph old houses and stop at small cafés in Panaji.'],['Pune','Shaniwar Wada','Discover Maratha-era history in central Pune, then continue into the surrounding markets and food streets.'],['Bengaluru','Lalbagh Botanical Garden','Explore the historic glasshouse, mature trees and seasonal plant displays on a peaceful solo walk.']]}};
function types(){app.innerHTML=nav('home')+`<main class="container page"><div class="pageTitle"><div class="eyebrow">Travel styles</div><h2>Travel more, spend smarter.</h2><p class="mini">Choose Family, Friends, Business or Solo to open a dedicated recommendation page.</p></div><div class="typeGrid">${Object.entries(tripTypes).map(([k,v])=>`<article class="typeCard" onclick="typeDetail('${k}')"><div class="typeIcon">${v.icon}</div><h3>${v.title}</h3><p>${v.desc}</p><button class="btn secondary" onclick="event.stopPropagation();typeDetail('${k}')">Explore →</button></article>`).join('')}</div></main>`}
function typeDetail(k){const t=tripTypes[k];app.innerHTML=nav('home')+`<main class="container page"><section class="card typeHero"><div><div class="eyebrow">${t.icon} ${t.title}</div><h2 style="font-size:42px;margin:7px 0">Best places for your trip</h2><p class="mini">${t.desc}</p></div><button class="btn primary" onclick="planDestination('${k}',event)">Build this trip →</button></section><section class="section recGrid">${t.places.map(p=>`<article class="recCard"><img class="recImg" loading="eager" src="/api/place-image?name=${encodeURIComponent(p[1])}&city=${encodeURIComponent(p[0])}" alt="${esc(p[1])}" onerror="this.onerror=null;this.parentElement.classList.add('noImage');this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<span>Real image unavailable</span>')"><div class="recBody"><span class="badge">${esc(p[0])}</span><h3>${esc(p[1])}</h3><p class="mini">${esc(p[2])}</p><button class="btn secondary" onclick="planDestination('${esc(p[0])}',event)">Plan ${esc(p[0])} →</button></div></article>`).join('')}</section></main>`}
function planDestination(cityOrType,event){if(event)event.stopPropagation();const city=tripTypes[cityOrType]?((tripTypes[cityOrType].places[0]||[])[0]):cityOrType;sessionStorage.setItem('quickDestination',city);location.hash='planner';render();scrollTo(0,0)}
async function admin(){app.innerHTML=nav('admin')+`<main class="container"><div class="pageTitle"><div class="eyebrow">Administrator</div><h2>YatraAI control centre</h2><p class="mini">Monitor travellers, trips, feedback and generate reports.</p></div><div id="adminBox"></div></main>`;try{const [s,u,t,f]=await Promise.all([api('/admin/stats'),api('/admin/users'),api('/admin/trips'),api('/admin/feedback')]);window.adminUsers=u;const today=new Date().toISOString().slice(0,10);
document.getElementById('adminBox').innerHTML=`<div class="statgrid"><div class="stat"><small>Users</small><strong>${s.users}</strong></div><div class="stat"><small>Trips</small><strong>${s.trips}</strong></div><div class="stat"><small>Admins</small><strong>${s.admins}</strong></div><div class="stat"><small>Feedback</small><strong>${s.feedback}</strong></div></div>
<section class="section card formCard"><h3>Generate trip report</h3><div class="reportFilters2"><div class="field"><label>Report type</label><select id="rtype" onchange="reportTypeChanged()"><option value="all">All trips</option><option value="date">Date-wise (From – To)</option><option value="user">Traveller-wise</option><option value="place">Place-wise</option><option value="city">City-wise</option></select></div>
<div class="field" id="rvalueWrap" style="display:none"><label id="rvalueLabel">Filter value</label><input id="rvalue" list="rvalueList" placeholder=""><datalist id="rvalueList">${u.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>
<div class="field" id="rfromWrap" style="display:none"><label>From date</label><input id="rfrom" type="date" max="${today}"></div><div class="field" id="rtoWrap" style="display:none"><label>To date</label><input id="rto" type="date" max="${today}"></div>
<div class="field"><button class="btn primary" onclick="runReport()">Generate report</button></div></div><div id="reportBox" style="margin-top:18px"></div></section>
<section class="section cards2"><div class="card formCard"><h3>Registered travellers</h3><div class="tableWrap"><table class="table"><tr><th>Name</th><th>Email</th><th>City</th></tr>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.city)}</td></tr>`).join('')}</table></div></div><div class="card formCard"><h3>Recent feedback</h3>${f.slice(0,8).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><b>${esc(x.userName)}</b><p class="mini">${esc(x.message)}</p></div>`).join('')||'<p class="mini">No feedback yet.</p>'}</div></section>`;reportTypeChanged()}catch(x){document.getElementById('adminBox').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
function reportTypeChanged(){const t=$('rtype').value;$('rvalueWrap').style.display=['user','place','city'].includes(t)?'':'none';$('rfromWrap').style.display=$('rtoWrap').style.display=(t==='date')?'':'none';
$('rvalueLabel').textContent=t==='user'?'Traveller name or email':t==='place'?'Place (e.g. Taj Mahal, Baga Beach)':t==='city'?'City / destination (e.g. Goa)':'Filter value';
const dl=$('rvalueList');if(dl)dl.innerHTML=t==='user'?(window.adminUsers||[]).map(x=>`<option value="${esc(x.name)}">`).join(''):'';}
async function runReport(){const box=$('reportBox');try{const type=$('rtype').value;let q='type='+encodeURIComponent(type);if(['user','place','city'].includes(type))q+='&value='+encodeURIComponent($('rvalue').value);if(type==='date'){q+='&from='+encodeURIComponent($('rfrom').value)+'&to='+encodeURIComponent($('rto').value)}
box.innerHTML='<div class="mini">Generating…</div>';const r=await api('/admin/report?'+q);window.lastReport=r;
box.innerHTML=`<div class="success" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span><b>${r.count}</b> matching trip(s) • ${r.totalTravellers} travellers • budget ₹${money(r.totalBudget)} • estimated ₹${money(r.totalEstimate)}</span><span style="display:flex;gap:8px"><button class="btn primary" onclick="downloadReportPdf()">⬇ Download PDF</button><button class="btn secondary" onclick="downloadReport()">Download CSV</button></span></div>
<div class="tableWrap" style="margin-top:12px"><table class="table"><tr><th>Booked on</th><th>Traveller</th><th>From</th><th>Destination</th><th>Start date</th><th>Days</th><th>Adults + kids</th><th>Rooms</th><th>Budget</th><th>Estimate</th></tr>${r.rows.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleDateString()}</td><td>${esc(x.userName)}<div class="mini">${esc(x.userEmail)}</div></td><td>${esc(x.startLocation)}</td><td>${esc(x.destination)}</td><td>${esc(x.startDate||'—')}</td><td>${x.days}</td><td>${x.adults}+${x.children}</td><td>${x.rooms||'—'}</td><td>₹${money(x.budget)}</td><td>₹${money(x.estimatedCost)}</td></tr>`).join('')||'<tr><td colspan="10" class="mini">No trips match these filters.</td></tr>'}</table></div>`}catch(x){box.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
function downloadReportPdf(){const r=window.lastReport;if(!r){toast('Generate a report first.');return}if(!window.jspdf||!window.YatraPdf){toast('PDF library did not load. Refresh and try again.');return}try{const doc=YatraPdf.buildReportPdf(window.jspdf.jsPDF,r,me&&me.name);doc.save('YatraAI-'+r.type+'-report-'+new Date().toISOString().slice(0,10)+'.pdf');toast('Report PDF downloaded.')}catch(x){console.error(x);toast('Could not create the PDF: '+x.message)}}
function downloadReport(){const r=window.lastReport;if(!r){toast('Generate a report first.');return}const head=['Booked on','Traveller','Email','From','Destination','Start date','Days','Adults','Children','Rooms','Budget','Estimated Cost'];const lines=[head,...r.rows.map(x=>[new Date(x.createdAt).toLocaleDateString(),x.userName,x.userEmail,x.startLocation,x.destination,x.startDate||'',x.days,x.adults,x.children,x.rooms||'',x.budget,x.estimatedCost])].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yatraai-'+r.type+'-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}me=null;location.hash='login';render()}
function go(r){location.hash=r;render();scrollTo(0,0)}
async function render(){const r=location.hash.replace('#','')||'home';if(!me){gateway();return}if(r==='home')home();else if(r==='planner')planner();else if(r==='result')result();else if(r==='trips')trips();else if(r==='about')about();else if(r==='feedback')feedback();else if(r==='profile')profile();else if(r==='types')types();else if(r==='admin'&&me.role==='ADMIN')admin();else home()}
async function boot(){try{me=await api('/auth/me');render()}catch{me=null;gateway()}}window.addEventListener('hashchange',render);boot();
</script></body></html>
